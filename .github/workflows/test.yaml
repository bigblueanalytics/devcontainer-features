name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVCONTAINER_CLI_VERSION: 0.89.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck src/*/install.sh test/*/*.sh

      - name: devcontainer-feature.json is valid
        uses: devcontainers/action@v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: ./src

  # Default options on each base the org's devcontainers build from: debian bookworm
  # (etl, airflow), trixie (api, web) and the stock Ubuntu image (the infra repos).
  feature:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base-image:
          - debian:bookworm
          - debian:trixie
          - mcr.microsoft.com/devcontainers/base:noble
    steps:
      - uses: actions/checkout@v7

      - run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - run: devcontainer features test --skip-scenarios --features dx --base-image "${{ matrix.base-image }}" .

  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - run: devcontainer features test --skip-autogenerated --features dx .

  # The path compose-backed devcontainers take: install.sh run from a Dockerfile.
  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker build -f test/dockerfile/Dockerfile -t dx-dockerfile .

      - run: docker run --rm dx-dockerfile
